{{/*
실습용이다. 운영에서는 이 파일을 쓰지 않고 기관 비밀 관리 체계나 클러스터의 외부
비밀 연동으로 넣는다. 그 판단을 10.2 에 적어 두었다.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app.kubernetes.io/part-of: eum
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
