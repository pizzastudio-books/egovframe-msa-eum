spring:
  application:
    name: eum-gateway

  cloud:
    gateway:
      # 경로 분배는 인그레스가 이미 한다. 여기서는 뒤에 있는 서비스로 넘기기만 한다.
      # 주소가 아니라 클러스터 DNS 이름으로 부른다 — 별도 레지스트리를 두지 않는다(14.2).
      server:
        webmvc:
          # **좁은 경로를 먼저 적는다.** 위에서부터 맞는 것을 찾고 먼저 맞은 것으로
          # 끝낸다. /api/v1/** 를 위에 두면 /api/v1/payments/** 는 영영 걸리지 않고
          # 지급 요청이 본체로 간다. 본체에는 그 경로가 없으니 404 가 나는데,
          # 게이트웨이 설정을 의심하기까지 한참 걸린다.
          routes:
            # 아직 옮기지 않은 것은 옛 곳으로 보낸다(16.4). 부르는 쪽은 주소가 하나다.
            # 옮길 때마다 이 목록만 고치면 되고, 화면과 외부 연계는 그대로 둔다.
            - id: legacy
              uri: ${EUM_LEGACY_URI:http://localhost:9000}
              predicates:
                - Path=/api/legacy/**
            - id: eum-payment
              uri: ${EUM_PAYMENT_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/payments/**
            - id: eum-core
              uri: ${EUM_CORE_URI:http://localhost:8080}
              predicates:
                - Path=/api/v1/**

server:
  port: 8000

token:
  secret: ${TOKEN_SECRET:eum_local_token_secret}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.pizzastudio.eum: info
