spring:
  application:
    name: eum-payment

  datasource:
    url: jdbc:h2:mem:eum_pay;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/eum-payment-schema.sql

  cloud:
    function:
      definition: applicationApproved
    stream:
      bindings:
        applicationApproved-in-0:
          destination: application-approved
          group: eum-payment
          consumer:
            max-attempts: 3
        payment-completed-out-0:
          destination: payment-completed
        payment-failed-out-0:
          destination: payment-failed
      rabbit:
        bindings:
          applicationApproved-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8082

eum:
  outbox:
    enabled: true
    interval-millis: 2000
  batch:
    payment:
      enabled: true
      cron: "0 0 2 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.pizzastudio.eum: debug

# 게이트웨이와 같은 열쇠로 서명을 확인한다(16.3).
token:
  secret: ${TOKEN_SECRET:eum_local_token_secret}
