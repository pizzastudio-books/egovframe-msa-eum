// 지급 서비스 — 17장에서 분리, 18장 사가의 무대.
//
// 계좌라는 민감 자료, 다른 보존·감사 요건, 야간 대량이라는 다른 부하 특성,
// 외부 금융망 연계. 인스턴스를 나눌 근거가 실제로 있는 유일한 업무다.
plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':eum-contract')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 조회 API 를 열면서 인증이 필요해졌다. 게이트웨이가 이미 검증했더라도 다시 한다(16.3).
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 지표를 프로메테우스 형식으로 내보낸다(19.2). 액추에이터만으로는 수집기가 못 읽는다.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-rabbit'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'com.mysql:mysql-connector-j:8.4.0'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
    testImplementation 'org.springframework.security:spring-security-test'
}
