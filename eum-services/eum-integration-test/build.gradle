// 서비스 사이를 잇는 통합시험.
//
// 서비스 하나짜리 시험은 자기 안에서만 맞으면 통과한다. 본체가 내보낸 메시지를 지급이
// 못 읽어도 각자 시험은 초록색이다. 여기서는 **본체와 지급을 한 시험에 같이 띄우고,
// 한쪽이 실제로 내보낸 메시지를 다른 쪽에 그대로 넣어** 사가 한 바퀴를 확인한다.
//
// 배포물이 아니다. 시험만 있고 bootJar 도 만들지 않는다.

dependencies {
    testImplementation project(':eum-contract')
    testImplementation project(':eum-core')
    testImplementation project(':eum-payment')
    testImplementation project(':eum-notification')

    testImplementation 'org.springframework.cloud:spring-cloud-stream'
    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.yaml:snakeyaml'
    testRuntimeOnly 'com.h2database:h2'
}
