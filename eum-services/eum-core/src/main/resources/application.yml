spring:
  application:
    name: eum-core

  datasource:
    # 운영 전제는 기관 MySQL. 실습은 H2 를 MySQL 모드로 띄운다.
    # 5장에서 이 인메모리 DB 가 왜 문제가 되는지 다룬다.
    url: jdbc:h2:mem:eum;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
      hibernate.format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/eum-core-schema.sql
      data-locations: classpath:db/eum-core-data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  # 브로커 바인딩. 보내는 쪽은 아웃박스 발송기가, 받는 쪽은 리스너 어댑터가 쓴다(18.2).
  cloud:
    function:
      definition: paymentCompleted;paymentFailed
    stream:
      bindings:
        application-approved-out-0:
          destination: application-approved
        notification-requested-out-0:
          destination: notification-requested
        paymentCompleted-in-0:
          destination: payment-completed
          group: eum-core
        paymentFailed-in-0:
          destination: payment-failed
          group: eum-core

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8080

# 토큰
token:
  secret: eum_local_token_secret
  expiration-millis: 3600000


eum:
  outbox:
    enabled: true
    interval-millis: 2000
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.pizzastudio.eum.core: debug
