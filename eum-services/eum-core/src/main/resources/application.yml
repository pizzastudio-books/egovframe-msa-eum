spring:
  application:
    name: eum-core

  servlet:
    multipart:
      # 첨부 크기 상한. **인그레스의 proxy-body-size(20m)보다 작아야 한다**(9.2).
      #
      # 안 적으면 스프링 기본값 1MB 로 돌고, 사업자등록증 스캔 한 장에도 걸린다.
      # 실측으로 1024KB 는 201, 1100KB 는 413 이었다.
      #
      # 인그레스가 먼저 끊으면 사용자는 nginx 의 영문 HTML 을 받고 앱은 그 요청을
      # 본 적조차 없어 기록도 안 남는다. **끊는 자리를 앱으로 당겨 놓는다.**
      max-file-size: 15MB
      max-request-size: 18MB

  datasource:
    # 운영 전제는 기관 MySQL. 실습은 H2 를 MySQL 모드로 띄운다.
    # 5장에서 이 인메모리 DB 가 왜 문제가 되는지 다룬다.
    url: jdbc:h2:mem:eum;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
      hibernate.format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/eum-core-schema.sql
      data-locations: classpath:db/eum-core-data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  # 브로커 바인딩. 보내는 쪽은 아웃박스 발송기가, 받는 쪽은 리스너 어댑터가 쓴다(18.2).
  cloud:
    function:
      definition: paymentCompleted;paymentFailed
    stream:
      bindings:
        application-approved-out-0:
          destination: application-approved
        notification-requested-out-0:
          destination: notification-requested
        paymentCompleted-in-0:
          destination: payment-completed
          group: eum-core
        paymentFailed-in-0:
          destination: payment-failed
          group: eum-core

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8080

# 토큰
token:
  secret: eum_local_token_secret
  expiration-millis: 3600000


eum:
  outbox:
    enabled: true
    interval-millis: 2000
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      # 응답 시간 분위수를 보려면 히스토그램을 켜야 한다. 기본은 꺼져 있어
      # histogram_quantile 이 빈 결과를 낸다 — 대시보드만 만들고 값이 안 나온다(19.2).
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.pizzastudio.eum.core: debug
