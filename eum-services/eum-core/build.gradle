// 이음 본체 — 회원·공통·지원사업·신청·심사
plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':eum-contract')

    implementation("org.egovframe.rte:egovframe-rte-fdl-cmmn:5.0.0") {
        exclude group: 'org.egovframe.rte', module: 'egovframe-rte-fdl-logging'
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 브로커. 아웃박스 발송기와 리스너 어댑터만 이 의존을 안다(18.2)
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-rabbit'

    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'com.mysql:mysql-connector-j:8.4.0'
    runtimeOnly 'com.h2database:h2'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    testImplementation 'org.springframework.security:spring-security-test'
    // 브로커 없이 발행·수신을 검증한다
    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
}

def querydslDir = "$buildDir/generated/querydsl"
sourceSets { main.java.srcDirs += [querydslDir] }
clean { delete file(querydslDir) }
tasks.withType(JavaCompile) { options.generatedSourceOutputDirectory = file(querydslDir) }
