// 이음 — 서비스 분리본 (4~5부)
//
// 한 덩어리였던 이음을 네 벌로 나눈다.
//   eum-gateway       토큰 검증·권한 전파·감사 로그
//   eum-core          회원·공통·지원사업·신청·심사
//   eum-notification  문자·메일 발송        (15장에서 첫 분리)
//   eum-payment       지급 지시·이체 연계   (17장에서 분리, 18장 사가)
//
// eum-contract 는 서비스 사이에 오가는 이벤트 규격만 담는다. 업무 코드를 공유하는
// 공통 모듈을 두지 않는 이유는 14.2 에서 밝힌다. 공통 모듈이 커지면 그것을 고칠 때마다
// 넷을 다 다시 배포해야 해서 나눈 뜻이 없어진다.

plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.0' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.pizzastudio.eum'
    version = '1.0.0'
    sourceCompatibility = '17'
    targetCompatibility = '17'

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://maven.egovframe.go.kr/maven/" }
    }

    ext {
        set('springBootVersion', '3.5.16')
        set('springCloudVersion', '2025.0.0')
    }

    dependencyManagement {
        imports {
            // 부트 플러그인을 붙이지 않는 모듈(eum-contract)도 버전을 알 수 있게 한다
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }


    // 취약점 점검(7.3)에서 나온 것을 올린다. 부트 BOM 이 가리키는 판보다 뒤의 것이라
    // 여기서 따로 못 박는다. 부트 판을 올릴 때 이 블록이 필요 없어졌는지 함께 확인한다.
    configurations.all {
        resolutionStrategy.eachDependency {
            if (it.requested.group == 'io.netty') {
                it.useVersion '4.1.136.Final'          // CVE-2026-59901·55831·55833·56745·56819
            }
            if (it.requested.group == 'org.bouncycastle') {
                it.useVersion '1.84'                    // CVE-2025-14813
            }
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs.add('-parameters')
        options.encoding = 'UTF-8'
    }

    test {
    // 실패 메시지를 콘솔에도 온전히 찍는다.
    //
    // 기본값에서는 `java.lang.AssertionError` 한 줄만 나오고 어느 클래스가 무엇을 어겼는지는
    // HTML 보고서를 열어야 보인다. **CI 로그만 보는 사람에게는 아무 정보가 없다**(13.3).
    testLogging {
        exceptionFormat = 'full'
        showStackTraces = false
        events 'failed'
    }
        useJUnitPlatform()
    }
}

// 부트 플러그인을 붙인 모듈은 실행 가능한 jar 이름을 app.jar 로 고정한다.
// build/libs 에 plain jar 도 함께 있어, Dockerfile 에서 *.jar 로 받으면 어느 쪽이
// 들어갈지 순서에 달린다. plain jar 가 들어가면 기본 클래스를 못 찾고 죽는다.
subprojects {
    plugins.withId('org.springframework.boot') {
        tasks.named('bootJar') {
            archiveFileName = 'app.jar'
        }
    }
}

// 같은 소스에서 같은 jar 가 나오게 한다.
//
// 기본값에서는 jar 안의 항목마다 **빌드한 시각**이 들어가서, 소스를 한 글자도 안 고치고
// 다시 빌드해도 파일 다이제스트가 달라진다. 실제로 두 번 빌드해 확인했다(6.4).
//
// 다이제스트가 매번 달라지면 "이 이미지가 그 소스에서 나온 것인가"를 대조할 수 없다.
// 폐쇄망 반입 때 무결성을 다이제스트로 확인하므로(7.2) 그대로 두면 안 된다.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
