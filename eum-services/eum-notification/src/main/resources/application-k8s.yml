# 클러스터에서 띄울 때.
#
# 값은 컨피그맵과 시크릿이 환경변수로 넣는다. 이 파일에는 "어디서 읽는가"만 적고
# 실제 값은 적지 않는다. 이미지 안에 환경을 굳히지 않는다(5.2·10.1).

# 파드마다 주소가 따로라 포트를 겹치지 않게 피할 이유가 없다.
#
# application.yml 의 8081·8082 는 노트북에서 네 서비스를 한꺼번에 띄우려고 정한 값이다.
# 그 값이 컨테이너까지 따라오면 매니페스트의 containerPort 와 어긋나고, 파드는 뜨는데
# 프로브가 연결 거부로 실패해 계속 재시작한다. 실제로 겪었다.
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE:eum_noti}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  sql:
    init:
      # 스키마는 CREATE TABLE IF NOT EXISTS 라 여러 파드가 같이 떠도 한 번만 만들어진다.
      # 운영에서는 이것도 끄고 형상관리된 DDL 로 따로 적용한다(21.1).
      mode: always

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

# 프로브가 부르는 경로. 이것을 켜지 않으면 /actuator/health/readiness 가 404 라
# 파드가 영영 준비되지 않는다(11.1).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    root: info
