spring:
  application:
    name: eum-notification

  datasource:
    url: jdbc:h2:mem:eum_noti;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/eum-notification-schema.sql

  cloud:
    function:
      definition: notificationRequested
    stream:
      bindings:
        notificationRequested-in-0:
          destination: notification-requested
          group: eum-notification
          consumer:
            max-attempts: 3
      rabbit:
        bindings:
          notificationRequested-in-0:
            consumer:
              # 세 번 실패하면 죽은편지 큐로 보낸다. 잃어버리지 않는다(15.4).
              auto-bind-dlq: true
              republish-to-dlq: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.pizzastudio.eum: debug
