apiVersion: v1
data:
  values.yaml: |
    # 노트북 kind 클러스터용.
    #
    #   helm install eum . -n eum --create-namespace -f values-local.yaml
    #
    # 서비스가 넷이라 3부보다 파드가 훨씬 많다. 노트북 한 대에서 다 뜨도록 레플리카 수와 자원
    # 요청을 줄인다. 본문은 관리형 클러스터를 기준으로 쓰고 실습은 이 값으로 돌린다.

    services:
      core:
        replicas: 2
        resources:
          requests: { cpu: "100m", memory: "384Mi" }
          limits:   { cpu: "1",    memory: "1Gi" }
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 4
          targetCPU: 60
        disruptionBudget:
          minAvailable: 1
        storage:
          enabled: true
          size: 1Gi
          # kind 기본 스토리지는 ReadWriteMany 를 주지 않는다.
          # 파드를 늘렸을 때 첨부 파일이 어떻게 갈리는지 10.3 에서 이 차이로 확인한다.
          accessMode: ReadWriteOnce
          mountPath: /usr/app/attachments

      notification:
        replicas: 3
        resources:
          requests: { cpu: "50m",  memory: "256Mi" }
          limits:   { cpu: "500m", memory: "512Mi" }
        autoscaling:
          enabled: false
        # 레플리카가 하나뿐이면 PDB 가 노드 정리를 막는다
        disruptionBudget:
          minAvailable: 0

      payment:
        replicas: 1
        resources:
          requests: { cpu: "50m", memory: "384Mi" }
          limits:   { cpu: "1",   memory: "768Mi" }
        autoscaling:
          enabled: false
        disruptionBudget:
          minAvailable: 0

      gateway:
        replicas: 1
        resources:
          requests: { cpu: "50m", memory: "384Mi" }
          limits:   { cpu: "1",   memory: "768Mi" }
        autoscaling:
          enabled: false
        disruptionBudget:
          minAvailable: 0

      web:
        replicas: 1
        disruptionBudget:
          minAvailable: 0
kind: ConfigMap
metadata:
  name: eum-values
  namespace: eum
