# 저장소를 기준으로 배포한다(20.2).
#
# **클러스터에 무엇이 도는지는 저장소가 정한다.** 손으로 kubectl apply 하지 않는다.
# 저장소를 고치고 밀면 컨트롤러가 그것을 읽어 클러스터를 맞춘다.
#
# 공공 사업에서 이 방식의 값어치는 배포 이력이다 — 누가 언제 무엇을 바꿨는지가 커밋으로
# 남는다. 11.3 의 change-cause 와 21.2 의 감리 설명 자료가 여기서 나온다.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: eum
  namespace: flux-system
spec:
  # 실습이라 공개 저장소를 그대로 읽는다. 폐쇄망에서는 기관 안의 git 을 가리킨다(20.3).
  url: https://github.com/pizzastudio-books/egovframe-msa-eum
  ref:
    branch: main
  interval: 1m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eum
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: eum
  path: ./eum-services-k8s/overlays/local
  targetNamespace: eum
  interval: 2m
  # 저장소에서 지운 것은 클러스터에서도 지운다. 이것이 없으면 저장소와 클러스터가
  # 조용히 벌어진다 — 지운 줄 알았는데 도는 상태다.
  prune: true
  # 배포가 끝난 것으로 볼 기준. 이것이 없으면 적용만 하고 뜨는지는 안 본다.
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: eum-core
      namespace: eum
    - apiVersion: apps/v1
      kind: Deployment
      name: eum-gateway
      namespace: eum
