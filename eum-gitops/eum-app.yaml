# 저장소를 기준으로 배포한다(20.2).
#
# **클러스터에 무엇이 도는지는 저장소가 정한다.** 손으로 kubectl 이나 helm 을 치지 않는다.
# 저장소를 고치고 밀면 컨트롤러가 읽어 클러스터를 맞춘다.
#
# 공공 사업에서 이 방식의 값어치는 배포 이력이다 — 누가 언제 무엇을 바꿨는지가 커밋으로
# 남는다. 11.3 의 change-cause 와 21.2 의 감리 설명 자료가 여기서 나온다.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: eum
  namespace: flux-system
spec:
  # 실습이라 공개 저장소를 그대로 읽는다. 폐쇄망에서는 기관 안의 git 을 가리킨다(20.3).
  url: https://github.com/pizzastudio-books/egovframe-msa-eum
  ref:
    branch: main
  interval: 1m
---
# 값 파일을 클러스터로 나르는 길.
#
# **이것이 없으면 값이 저장소에만 있고 클러스터로 안 온다.** 실제로 겪었다 — HelmRelease 가
# `ConfigMap/eum-values` 를 읽는데 그 컨피그맵을 아무도 안 만들어 주고 있었다. 처음
# 세울 때 손으로 `kubectl apply` 한 것이 그대로 돌고 있었고, 저장소의 값을 고쳐 밀어도
# 아무 일도 안 일어났다. **오류도 안 난다** — GitRepository 는 새 커밋을 잘 받아 오고
# HelmRelease 도 "upgrade succeeded" 라고 답한다. 값만 옛것이다(20.2).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eum-values
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: eum
  path: ./eum-gitops/values
  prune: true
  targetNamespace: eum
---
# 20.1 에서 만든 헬름 차트를 릴리스로 관리한다.
#
# 매니페스트를 kustomize 로 직접 적용하는 길도 있다. 그러면 20.1 의 차트가 놀게 된다.
# **한 대상을 두 도구가 관리하면 서로 덮어쓴다** — 실제로 겪었다. 헬름으로 띄운 것을
# kustomize 로 또 적용하려 하자 컨트롤러가 차이를 재느라 멈췄다.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eum
  namespace: eum
spec:
  interval: 2m
  chart:
    spec:
      chart: ./eum-helm
      sourceRef:
        kind: GitRepository
        name: eum
        namespace: flux-system
      # **차트 판을 안 올리면 내용이 바뀌어도 안 당긴다.** 실제로 겪었다 —
      # values.yaml 을 고쳐 밀었는데 컨트롤러가 "in-sync" 라며 넘어갔다. 차트 판이
      # 1.0.0 그대로라 같은 것으로 본 것이다. 커밋마다 다시 보게 한다(20.2).
      reconcileStrategy: Revision
  valuesFrom:
    - kind: ConfigMap
      name: eum-values
  # **손으로 바꾼 것을 되돌리는 것은 기본이 아니다.** 켜야 한다.
  # 실제로 겪었다 — 저장소를 고치면 따라오는데, 손으로 kubectl scale 한 값은 그대로
  # 남아 있었다. 저장소와 클러스터가 조용히 벌어지는 상태다(20.2).
  driftDetection:
    mode: enabled

  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      # 올리다 실패하면 되돌린다. 손이 안 닿는 새벽에도 마찬가지다(11.3).
      remediateLastFailure: true
