# 클러스터 안에서 이음을 부르는 이름(9.1).
# 이 이름이 곧 서비스 탐색이다. 별도 레지스트리를 두지 않는 이유가 여기 있다(14.2).
apiVersion: v1
kind: Service
metadata:
  name: eum
  namespace: eum
  labels:
    app.kubernetes.io/name: eum
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eum
  ports:
    - name: http
      port: 80
      targetPort: http
