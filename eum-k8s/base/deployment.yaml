# 이음 본체. 아직 나누지 않은 한 덩어리 그대로다(8.2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eum
  namespace: eum
  labels:
    app.kubernetes.io/name: eum
    app.kubernetes.io/part-of: eum
  annotations:
    kubernetes.io/change-cause: "최초 배포"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: eum
  # 배포하는 동안 접수 화면이 닫히지 않게 한다(11.3)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eum
        app.kubernetes.io/part-of: eum
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # 파드를 여러 영역에 흩어 놓는다. 한 영역이 통째로 죽어도 서비스가 이어진다(12.1)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: eum
      # 데이터베이스가 뜨기를 기다린다.
      #
      # **쿠버네티스는 기동 순서를 보장하지 않는다.** 앱이 먼저 떠서 데이터베이스를 못 찾으면
      # `UnknownHostException: eum-mysql` 로 죽고, 쿠버네티스가 다시 띄운다. 결국은 자리를
      # 잡지만 그때까지 파드가 두세 번 재시작한다. 갓 올린 시스템에서 `RESTARTS 3` 을 본
      # 운영자는 장애로 여긴다.
      #
      # **새 이미지를 들여오지 않으려고 앱 이미지를 그대로 쓴다.** 폐쇄망에서는 이미지 하나가
      # 반입 절차 하나다(7.1). busybox 를 쓰면 그것도 반출·검증·서명 대상이 된다.
      initContainers:
        - name: wait-db
          image: eum/eum-mono:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - 'until timeout 1 bash -c "</dev/tcp/eum-mysql/3306"; do echo "데이터베이스를 기다립니다"; sleep 2; done'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: eum
          image: eum/eum-mono:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eum-config
            - secretRef:
                name: eum-secret
          # 자원을 밝히지 않으면 스케줄러가 판단할 근거가 없고, 한 파드가 노드를
          # 잠식하면 옆 파드가 축출된다(11.2)
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # 뜨는 중인 파드에 트래픽이 가지 않게 한다(11.1)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # 처리 중인 요청을 끝내고 내려간다(11.1)
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          volumeMounts:
            - name: attachments
              mountPath: /usr/app/attachments
      terminationGracePeriodSeconds: 40
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: eum-attachments
