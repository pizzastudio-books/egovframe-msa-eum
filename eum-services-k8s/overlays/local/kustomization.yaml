# 노트북 kind 클러스터용.
#
# 서비스가 넷이라 3부보다 파드가 훨씬 많다. 노트북 한 대에서 다 뜨도록 벌 수와
# 자원 요청을 줄인다. 본문은 관리형 클러스터를 기준으로 쓰고, 실습은 이 오버레이로
# 돌린다. 그 차이를 A.3 에 정리해 두었다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eum

resources:
  - ../../base
  - ../../db
  - ../../broker

patches:
  # 노트북에서는 서비스마다 한 벌씩만 띄운다
  - target:
      kind: Deployment
      name: eum-core
    patch: |-
      # HPA 가 벌 수를 정한다. 배포에도 replicas 를 적어 두면 둘이 서로 값을
      # 되돌려 파드 수가 오르내린다. 자동 확장을 켠 서비스에서는 지운다
      - op: remove
        path: /spec/replicas
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "384Mi"
  - target:
      kind: Deployment
      name: eum-notification
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
  - target:
      kind: Deployment
      name: eum-payment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
  - target:
      kind: Deployment
      name: eum-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
  - target:
      kind: Deployment
      name: eum-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # 벌이 하나면 PDB 가 배포를 막는다. 노트북에서는 0 으로 둔다
  - target:
      kind: PodDisruptionBudget
      name: eum-core
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      kind: PodDisruptionBudget
      name: eum-notification
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: PodDisruptionBudget
      name: eum-payment
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: PodDisruptionBudget
      name: eum-gateway
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: PodDisruptionBudget
      name: eum-web
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # 노트북에서는 본체만 자동 확장을 켠다. 벌이 하나뿐인 서비스에 HPA 를 붙여 봐야
  # 늘릴 자리가 없다. 나머지 셋은 오브젝트째 지운다
  - target:
      kind: HorizontalPodAutoscaler
      name: eum-core
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
  - target:
      kind: HorizontalPodAutoscaler
      name: eum-notification
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: eum-notification
  - target:
      kind: HorizontalPodAutoscaler
      name: eum-payment
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: eum-payment
  - target:
      kind: HorizontalPodAutoscaler
      name: eum-gateway
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: eum-gateway

  # kind 기본 스토리지는 ReadWriteMany 를 주지 않는다(10.3)
  - target:
      kind: PersistentVolumeClaim
      name: eum-core-attachments
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: ["ReadWriteOnce"]
      - op: replace
        path: /spec/resources/requests/storage
        value: "1Gi"
