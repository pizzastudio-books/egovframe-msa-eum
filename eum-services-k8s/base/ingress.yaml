# 기관망 사용자가 들어오는 문(9.2).
#
# 화면과 API 를 여기서 가른다. API 는 전부 게이트웨이를 지나간다. 서비스별 경로를
# 인그레스에 늘어놓지 않는 이유는 16.1 에 있다 — 서비스가 늘 때마다 인그레스를 고쳐야
# 하고, 토큰 검증할 곳이 사라진다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eum
  namespace: eum
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: eum.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: eum-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eum-web
                port:
                  name: http
