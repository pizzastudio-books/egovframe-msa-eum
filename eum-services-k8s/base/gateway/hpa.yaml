apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eum-gateway
  namespace: eum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eum-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
