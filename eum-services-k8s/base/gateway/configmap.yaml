apiVersion: v1
kind: ConfigMap
metadata:
  name: eum-gateway
  namespace: eum
data:
  # 앱이 읽는 이름과 정확히 같아야 한다. 다르면 게이트웨이는 뜨지만 기본값인
  # localhost 로 넘기려 해서 전부 실패한다 — 로그에도 설정 오류로 보이지 않는다.
  # 뒤쪽 서비스는 클러스터 DNS 이름으로 부른다. 별도 레지스트리를 두지 않는다(14.2)
  EUM_CORE_URI: "http://eum-core"
  EUM_PAYMENT_URI: "http://eum-payment"
  # 아직 옮기지 않은 것이 있는 곳. 실습에서는 타 기관 연계를 흉내 내는 서버다(16.4).
  EUM_LEGACY_URI: "http://mock-legacy"
