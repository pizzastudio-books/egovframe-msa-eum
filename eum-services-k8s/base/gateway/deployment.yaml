# 게이트웨이 — 토큰 검증·권한 전파·감사 로그.
#
# 경로 분배와 TLS 종단은 인그레스가 맡는다. 여기서 또 하지 않는다(16.1).
# 요청마다 회원 서비스를 부르지도 않는다. 서명만으로 판단한다(16.3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eum-gateway
  namespace: eum
  labels:
    app.kubernetes.io/name: eum-gateway
    app.kubernetes.io/part-of: eum
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: eum-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eum-gateway
        app.kubernetes.io/part-of: eum
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: eum-gateway
      containers:
        - name: eum-gateway
          image: eum/eum-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: eum-common
            - configMapRef:
                name: eum-gateway
          env:
            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: TOKEN_SECRET
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 40
