apiVersion: v1
kind: ConfigMap
metadata:
  name: eum-core
  namespace: eum
data:
  MYSQL_DATABASE: "eum"
  EUM_FILE_DIRECTORY: "/usr/app/attachments"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
  # 아웃박스 발송기는 파드마다 돈다. **잠금은 걸지 않았다.** 두 파드가 같은 행을 집으면
  # 같은 이벤트가 두 번 나갈 수 있고, 받는 쪽 멱등이 그것을 받아 낸다(18.2·18.4).
  # 여기 주석이 한동안 "잠금으로 막는다"고 적혀 있었다. 코드에는 그런 잠금이 없다 —
  # 결정이 두 곳에 어긋나게 적히면 나중 사람이 매니페스트를 믿는다.
  EUM_OUTBOX_ENABLED: "true"
  EUM_OUTBOX_INTERVAL_MILLIS: "2000"
  # 타 기관 정보를 어떻게 읽는가. datasource 면 상대 DB 에 직접 붙고, api 면 상대가
  # 열어 준 연계 API 를 부른다. **1.2 의 넷째 문제가 이 값으로 갈린다.**
  #
  # 13.1 에서 갈아 끼울 자리(LegacyLookup)를 만들고 21.3 에서 api 로 바꿨다. 업무 코드는
  # 한 줄도 안 고쳤다. api 로 바꾸면 상대 기관 데이터소스 둘이 함께 사라져 파드당
  # 데이터소스가 3개에서 1개로 준다.
  EUM_LEGACY_MODE: "api"
  EUM_LEGACY_API_BASE_URI: "http://mock-legacy"
