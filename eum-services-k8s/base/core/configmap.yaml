apiVersion: v1
kind: ConfigMap
metadata:
  name: eum-core
  namespace: eum
data:
  MYSQL_DATABASE: "eum"
  EUM_FILE_DIRECTORY: "/usr/app/attachments"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
  # 아웃박스 발송기는 파드마다 돈다. 같은 행을 두 파드가 집지 않도록 잠금으로 막는다(18.2)
  EUM_OUTBOX_ENABLED: "true"
  EUM_OUTBOX_INTERVAL_MILLIS: "2000"
  # 타 기관 조회 방식. datasource 는 상대 DB 직결, api 는 연계 API(13.1).
  # api 로 바꾸면 상대 기관 데이터소스도 함께 사라진다.
  EUM_LEGACY_MODE: "datasource"
  EUM_LEGACY_API_BASE_URI: "http://mock-legacy"
