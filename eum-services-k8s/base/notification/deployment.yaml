# 알림 — 문자·메일 발송. 첫 분리 대상이다(15장).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eum-notification
  namespace: eum
  labels:
    app.kubernetes.io/name: eum-notification
    app.kubernetes.io/part-of: eum
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: eum-notification
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        # 이 표시가 있는 파드만 수집기가 긁는다(19.2). 서비스가 늘어도
        # 수집기 설정은 안 바뀐다.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app.kubernetes.io/name: eum-notification
        app.kubernetes.io/part-of: eum
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: eum-notification
      # 데이터베이스가 뜨기를 기다린다.
      #
      # **쿠버네티스는 기동 순서를 보장하지 않는다.** 앱이 먼저 떠서 데이터베이스를 못 찾으면
      # `UnknownHostException: eum-mysql` 로 죽고, 쿠버네티스가 다시 띄운다. 결국은 자리를
      # 잡지만 그때까지 파드가 두세 번 재시작한다. 갓 올린 시스템에서 `RESTARTS 3` 을 본
      # 운영자는 장애로 여긴다.
      #
      # **새 이미지를 들여오지 않으려고 앱 이미지를 그대로 쓴다.** 폐쇄망에서는 이미지 하나가
      # 반입 절차 하나다(7.1). busybox 를 쓰면 그것도 반출·검증·서명 대상이 된다.
      initContainers:
        - name: wait-db
          image: eum/eum-notification:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - 'until timeout 1 bash -c "</dev/tcp/eum-mysql/3306"; do echo "데이터베이스를 기다립니다"; sleep 2; done'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: eum-notification
          image: eum/eum-notification:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eum-common
            - configMapRef:
                name: eum-notification
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: NOTI_MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: NOTI_MYSQL_PASSWORD
            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: TOKEN_SECRET
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 40
