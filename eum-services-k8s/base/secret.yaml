# 실습용이다. 운영에서는 저장소에 두지 않는다(10.2).
#
# 계정이 서비스마다 다르다. 알림 계정으로는 신청서를 읽을 수 없다. 경계를 코드에만
# 두지 않고 데이터베이스 권한으로도 세운 것이다(13.2).
apiVersion: v1
kind: Secret
metadata:
  name: eum-secret
  namespace: eum
type: Opaque
stringData:
  TOKEN_SECRET: "eum_local_token_secret"
  RABBITMQ_USER: "eum"
  RABBITMQ_PASSWORD: "eum_rabbit"
  CORE_MYSQL_USER: "eum_app"
  CORE_MYSQL_PASSWORD: "eum_app"
  NOTI_MYSQL_USER: "noti_app"
  NOTI_MYSQL_PASSWORD: "noti_app"
  PAY_MYSQL_USER: "pay_app"
  PAY_MYSQL_PASSWORD: "pay_app"
