# 네 서비스와 화면.
#
# 파일이 스물 몇 장이다. 서비스가 하나였을 때는 열 장이었다. 서비스를 하나 더
# 나누면 여섯 장이 또 는다. 배포·서비스·컨피그맵·HPA·PDB 가 이름만 다르고 형태는
# 같다. 이 반복을 헬름 차트 하나로 줄이는 것이 20.1 이다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap-common.yaml
  - secret.yaml
  - ingress.yaml

  - core/configmap.yaml
  - core/deployment.yaml
  - core/service.yaml
  - core/pvc.yaml
  - core/hpa.yaml
  - core/pdb.yaml

  - notification/configmap.yaml
  - notification/deployment.yaml
  - notification/service.yaml
  - notification/hpa.yaml
  - notification/pdb.yaml

  - payment/configmap.yaml
  - payment/deployment.yaml
  - payment/service.yaml
  - payment/hpa.yaml
  - payment/pdb.yaml
  - payment/cronjob.yaml

  - gateway/configmap.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  - gateway/hpa.yaml
  - gateway/pdb.yaml

  - web/deployment.yaml
  - web/service.yaml
  - web/pdb.yaml
