# 지급 — 지시 생성·금융망 이체. 계좌가 여기에만 있다(17장).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eum-payment
  namespace: eum
  labels:
    app.kubernetes.io/name: eum-payment
    app.kubernetes.io/part-of: eum
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: eum-payment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eum-payment
        app.kubernetes.io/part-of: eum
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: eum-payment
      containers:
        - name: eum-payment
          image: eum/eum-payment:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eum-common
            - configMapRef:
                name: eum-payment
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: PAY_MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: PAY_MYSQL_PASSWORD
            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: TOKEN_SECRET
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eum-secret
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 40
