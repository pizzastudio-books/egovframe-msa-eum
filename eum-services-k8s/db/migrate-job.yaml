# 3부의 데이터를 4부의 데이터베이스로 옮긴다(17.3).
#
# 서비스를 나누면 표만 새로 만드는 것이 아니라 **이미 쌓인 데이터를 옮겨야 한다.**
# 실습에서는 3부(mono)로 띄워 신청·심사·지급을 만들어 본 뒤 4부로 넘어가므로 그 데이터가
# 옛 데이터베이스에 남는다. 옮기지 않으면 담당자 화면에서 지급 내역이 사라진 것처럼 보인다.
#
# **칼럼이 그대로 옮겨지지 않는다.** 실제로 대조해 보니 이렇게 달랐다.
#
#   eum.payment      payment_id application_id amount account_no status_id sent_at
#                    result_message create_date created_by modified_date last_modified_by
#   eum_pay.payment  payment_id event_id application_id applicant_id amount account_no
#                    status_id sent_at result_message created_at
#
# 새로 생긴 것(event_id·applicant_id), 이름이 바뀐 것(create_date → created_at),
# 없어진 것(created_by·modified_date·last_modified_by)이 섞여 있다.
#
# event_id 는 `NOT NULL UNIQUE` 인데 옛 데이터에는 그런 값이 없다. 옛 지급 건에 새 식별자를
# 만들어 넣되, **여러 번 돌려도 같은 값이 나오게** 만든다. 그래야 이관을 다시 돌려도
# 중복이 생기지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: eum-db-migrate
  namespace: eum
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-client
          # 서버와 같은 판을 쓴다. 8.4 를 쓰다가 서버(8.0)와 어긋난 것을 20.3 에서 잡았다 —
          # 클라이언트 판이 다르면 인증 방식이나 기본 문자셋이 달라질 수 있다.
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
          command:
            - sh
            - -c
            - |
              set -e
              # **문자셋을 지정하지 않으면 한글이 깨진다.** 실제로 겪었다 — 건수와 금액은
              # 맞는데 result_message 가 'ì\x9d´ì²´ ì™„ë£Œ' 로 들어갔다. mysql 클라이언트가
              # latin1 로 붙기 때문이다(18.2). 건수·금액만 보는 확인은 이것을 못 잡는다.
              M="mysql -h eum-mysql -uroot -p$MYSQL_ROOT_PASSWORD --default-character-set=utf8mb4 -N"

              # 4부부터 시작한 클러스터에는 옛 표가 없다. 그때는 옮길 것이 없다.
              HAS=$($M -e "select count(*) from information_schema.tables
                           where table_schema='eum' and table_name in ('payment','notification');")
              if [ "$HAS" != "2" ]; then
                echo "▶ 옛 표가 없습니다. 옮길 것이 없습니다."
                exit 0
              fi

              echo "▶ 옮기기 전"
              $M -e "select concat('  eum.payment           ', count(*)) from eum.payment;
                     select concat('  eum_pay.payment       ', count(*)) from eum_pay.payment;
                     select concat('  eum.notification      ', count(*)) from eum.notification;
                     select concat('  eum_noti.notification ', count(*)) from eum_noti.notification;"

              echo "▶ 지급을 옮깁니다"
              # 이미 옮긴 건은 건너뛴다. 이관은 몇 번을 돌려도 같은 결과여야 한다.
              $M -e "
                insert into eum_pay.payment
                  (event_id, application_id, applicant_id, amount, account_no,
                   status_id, sent_at, result_message, created_at)
                select
                  concat('migrated-', p.payment_id),
                  p.application_id,
                  a.applicant_id,
                  p.amount,
                  p.account_no,
                  p.status_id,
                  p.sent_at,
                  p.result_message,
                  coalesce(p.create_date, now())
                from eum.payment p
                left join eum.application a on a.application_id = p.application_id
                where not exists (
                  select 1 from eum_pay.payment q
                  where q.event_id = concat('migrated-', p.payment_id))
                  -- 이벤트로 이미 만들어진 지급이 있으면 넣지 않는다. 신청 한 건에
                  -- 지급이 둘이 되면 조회가 두 건을 받는다(17.2).
                  and not exists (
                    select 1 from eum_pay.payment r
                    where r.application_id = p.application_id);"

              echo "▶ 알림을 옮깁니다"
              $M -e "
                insert into eum_noti.notification
                  (event_id, receiver_id, channel_id, title, content, status_id, sent_at, created_at)
                select
                  concat('migrated-', n.notification_id),
                  n.receiver_id, n.channel_id, n.title, n.content,
                  n.status_id, n.sent_at, coalesce(n.create_date, now())
                from eum.notification n
                where not exists (
                  select 1 from eum_noti.notification m
                  where m.event_id = concat('migrated-', n.notification_id));"

              echo "▶ 옮긴 뒤"
              $M -e "select concat('  eum_pay.payment       ', count(*)) from eum_pay.payment;
                     select concat('  eum_noti.notification ', count(*)) from eum_noti.notification;"

              # 일부러 건너뛴 것과 옮기지 못한 것을 갈라 세야 한다. 같은 신청에 이벤트로
              # 만들어진 지급이 이미 있으면 옮기지 않는데, 그것까지 "실패"로 세면 늘 실패한다.
              echo "▶ 일부러 건너뛴 것"
              SKIPPED=$($M -e "
                select count(*) from eum.payment p
                where exists (select 1 from eum_pay.payment r
                              where r.application_id = p.application_id
                                and r.event_id <> concat('migrated-', p.payment_id));")
              echo "  이미 새 표에 지급이 있어 건너뜀: $SKIPPED 건"

              echo "▶ 정합성 확인 — 건너뛴 것 말고 전부 옮겨졌는가"
              MISSING=$($M -e "
                select count(*) from eum.payment p
                where not exists (
                  select 1 from eum_pay.payment q
                  where q.event_id = concat('migrated-', p.payment_id))
                  and not exists (
                    select 1 from eum_pay.payment r
                    where r.application_id = p.application_id);")
              echo "  옮겨지지 않은 지급: $MISSING 건"
              if [ "$MISSING" != "0" ]; then
                echo "  ✗ 이관이 끝나지 않았습니다"
                exit 1
              fi

              # 금액도 대조한다. 건수만 맞고 금액이 틀린 이관을 실제로 겪는다.
              echo "▶ 금액 합계가 맞는가"
              OLD=$($M -e "
                select coalesce(sum(p.amount),0) from eum.payment p
                where not exists (select 1 from eum_pay.payment r
                                  where r.application_id = p.application_id
                                    and r.event_id <> concat('migrated-', p.payment_id));")
              NEW=$($M -e "select coalesce(sum(amount),0) from eum_pay.payment
                           where event_id like 'migrated-%';")
              echo "  옮기기로 한 것의 합계 $OLD"
              echo "  실제로 옮긴 것의 합계 $NEW"
              if [ "$OLD" != "$NEW" ]; then
                echo "  ✗ 합계가 다릅니다. 옮기다 만 것이 있습니다."
                exit 1
              fi

              # 건수와 금액이 맞아도 글자가 깨질 수 있다. 옮긴 값이 원본과 같은지 본다.
              echo "▶ 글자가 그대로인가"
              GARBLED=$($M -e "
                select count(*) from eum.payment p
                join eum_pay.payment q on q.event_id = concat('migrated-', p.payment_id)
                where not (q.result_message <=> p.result_message);")
              echo "  원본과 다른 글자: $GARBLED 건"
              if [ "$GARBLED" != "0" ]; then
                echo "  ✗ 옮기면서 글자가 바뀌었습니다. 문자셋을 확인하십시오."
                exit 1
              fi

              echo "▶ 끝났습니다. 옛 표는 지우지 않습니다 — 되돌릴 수 있어야 합니다(17.3)."
