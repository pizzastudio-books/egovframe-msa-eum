# 데이터베이스와 계정을 적용하는 작업.
#
# MySQL 이미지의 `/docker-entrypoint-initdb.d` 는 **데이터 디렉터리가 비어 있을 때만**
# 돈다. 3부에서 한 덩어리로 띄우며 데이터베이스를 만들어 두었다면, 4부에서 컨피그맵에
# 계정을 더해도 다시 돌지 않는다. 실제로 겪었다 — 알림·지급이 `Access denied for user
# 'noti_app'` 으로 재시작을 되풀이했다.
#
# 그래서 스키마·계정 적용을 애플리케이션 밖의 작업으로 뺀다. 11.4 에서 정한 방향과 같다.
# SQL 이 `IF NOT EXISTS` 로 쓰여 있어 몇 번을 돌려도 같은 결과가 된다.
apiVersion: batch/v1
kind: Job
metadata:
  name: eum-db-init
  namespace: eum
spec:
  # 작업 정의는 바뀌지 않는데 다시 돌려야 할 때가 있다. up.sh 가 지우고 다시 만든다.
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-client
          image: mysql:8.4
          env:
            # 실습용이라 mysql.yaml 과 같은 값을 쓴다. 운영에서는 시크릿에서 받는다.
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
          command:
            - sh
            - -c
            - |
              set -e
              echo "▶ MySQL 을 기다립니다"
              until mysqladmin ping -h eum-mysql -uroot -p"$MYSQL_ROOT_PASSWORD" --silent 2>/dev/null; do
                sleep 2
              done
              echo "▶ 데이터베이스와 계정을 적용합니다"
              for f in /sql/*.sql; do
                echo "  $f"
                mysql -h eum-mysql -uroot -p"$MYSQL_ROOT_PASSWORD" < "$f"
              done
              echo "▶ 적용 결과"
              mysql -h eum-mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N \
                -e "select concat('  계정 ', user) from mysql.user where user like '%_app';"
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: eum-mysql-init
