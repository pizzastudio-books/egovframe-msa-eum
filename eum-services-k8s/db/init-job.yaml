# 데이터베이스와 계정을 적용하는 작업.
#
# MySQL 이미지의 `/docker-entrypoint-initdb.d` 는 **데이터 디렉터리가 비어 있을 때만**
# 돈다. 3부에서 한 덩어리로 띄우며 데이터베이스를 만들어 두었다면, 4부에서 컨피그맵에
# 계정을 더해도 다시 돌지 않는다. 실제로 겪었다 — 알림·지급이 `Access denied for user
# 'noti_app'` 으로 재시작을 되풀이했다.
#
# 그래서 스키마·계정 적용을 애플리케이션 밖의 작업으로 뺀다. 11.4 에서 정한 방향과 같다.
# SQL 이 `IF NOT EXISTS` 로 쓰여 있어 몇 번을 돌려도 같은 결과가 된다.
apiVersion: batch/v1
kind: Job
metadata:
  name: eum-db-init
  namespace: eum
spec:
  # 작업 정의는 바뀌지 않는데 다시 돌려야 할 때가 있다. up.sh 가 지우고 다시 만든다.
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-client
          image: mysql:8.4
          env:
            # 실습용이라 mysql.yaml 과 같은 값을 쓴다. 운영에서는 시크릿에서 받는다.
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
          command:
            - sh
            - -c
            - |
              set -e
              echo "▶ MySQL 을 기다립니다"
              until mysqladmin ping -h eum-mysql -uroot -p"$MYSQL_ROOT_PASSWORD" --silent 2>/dev/null; do
                sleep 2
              done
              echo "▶ 데이터베이스와 계정을 적용합니다"
              for f in /sql/*.sql; do
                echo "  $f"
                mysql -h eum-mysql -uroot -p"$MYSQL_ROOT_PASSWORD" < "$f"
              done
              # 표는 CREATE TABLE IF NOT EXISTS 라 이미 있으면 그대로다. **칼럼을 더하는 것은
              # 별개 일이다.** 19.1 에서 outbox_event 에 request_id 를 더하며 겪었다 —
              # 애플리케이션 초기화로는 안 되고, MySQL 8.4 는 ADD COLUMN IF NOT EXISTS 도
              # 지원하지 않는다. 그래서 있는지 보고 없을 때만 더한다(11.4).
              echo "▶ 칼럼 변경을 적용합니다"
              # 표는 있으면 그대로 두지만 **칼럼을 더하는 것은 별개 일이다.**
              # 셸에서 따옴표를 겹치면 조회가 조용히 빈 값을 낸다 — 실제로 겪었다.
              # "없다"고 판정하고 ALTER 를 걸어 Duplicate column 으로 죽었다. 그래서
              # SQL 파일로 넘긴다.
              cat > /tmp/addcol.sql <<'SQL'
              set @c := (select count(*) from information_schema.columns
                         where table_schema='eum' and table_name='outbox_event'
                           and column_name='request_id');
              set @s := if(@c=0,
                'alter table eum.outbox_event add column request_id varchar(64) null',
                'select "eum.outbox_event.request_id 이미 있음"');
              prepare st from @s; execute st; deallocate prepare st;

              set @c2 := (select count(*) from information_schema.columns
                          where table_schema='eum_pay' and table_name='outbox_event'
                            and column_name='request_id');
              set @s2 := if(@c2=0,
                'alter table eum_pay.outbox_event add column request_id varchar(64) null',
                'select "eum_pay.outbox_event.request_id 이미 있음"');
              prepare st2 from @s2; execute st2; deallocate prepare st2;
              SQL
              sed 's/^              //' /tmp/addcol.sql | \
                mysql -h eum-mysql -uroot -p"$MYSQL_ROOT_PASSWORD" --default-character-set=utf8mb4

              echo "▶ 적용 결과"
              mysql -h eum-mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N \
                -e "select concat('  계정 ', user) from mysql.user where user like '%_app';"
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: eum-mysql-init
