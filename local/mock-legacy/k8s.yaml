# 타 기관 연계 API 를 흉내 내는 서버.
#
# 실제 사업에서는 상대 기관이 운영하는 시스템이다. 실습에서 붙을 수 없으므로 이것을
# 대신 올린다. 13.1 에서 데이터베이스 직결을 이 API 호출로 바꾼다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-legacy
  namespace: eum
  labels:
    app.kubernetes.io/name: mock-legacy
    app.kubernetes.io/part-of: eum-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-legacy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-legacy
    spec:
      containers:
        - name: mock-legacy
          image: eum/mock-legacy:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mock-legacy
  namespace: eum
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-legacy
  ports:
    - name: http
      port: 80
      targetPort: http
