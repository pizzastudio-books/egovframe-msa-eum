apiVersion: v1
kind: Namespace
metadata: {name: eum}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: eum-payment, namespace: eum}
spec:
  replicas: 1
  selector: {matchLabels: {app: eum-payment}}
  template:
    metadata: {labels: {app: eum-payment}}
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-text=지급 서비스", "-listen=:8080"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: eum-payment, namespace: eum}
spec:
  selector: {app: eum-payment}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: eum-notification, namespace: eum}
spec:
  replicas: 1
  selector: {matchLabels: {app: eum-notification}}
  template:
    metadata: {labels: {app: eum-notification}}
    spec:
      containers:
        - name: app
          image: curlimages/curl:8.11.1
          command: ["sleep", "36000"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: eum-core, namespace: eum}
spec:
  replicas: 1
  selector: {matchLabels: {app: eum-core}}
  template:
    metadata: {labels: {app: eum-core}}
    spec:
      containers:
        - name: app
          image: curlimages/curl:8.11.1
          command: ["sleep", "36000"]
