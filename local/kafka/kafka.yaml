# 부록 F 실습용 카프카.
#
# **주키퍼 없이 돕니다**(KRaft). 예전에는 카프카 한 대를 띄우려면 주키퍼도 함께 띄워야
# 했는데, 지금은 카프카가 스스로 합니다. 폐쇄망 반입에서 이미지 하나가 줄어듭니다(7.2).
#
# 실습용이라 한 대뿐이고 볼륨도 안 붙였습니다. 운영에서는 셋 이상을 서로 다른 영역에
# 두고 복제본을 셋으로 둡니다(12.1).
apiVersion: v1
kind: Service
metadata:
  name: eum-kafka
  namespace: eum
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: eum-kafka
  ports:
    - name: client
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eum-kafka
  namespace: eum
spec:
  serviceName: eum-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eum-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eum-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - name: client
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://eum-kafka-0.eum-kafka.eum.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@eum-kafka-0.eum-kafka.eum.svc.cluster.local:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            # 실습이라 복제본이 하나다. 운영에서는 셋 이상이어야 한 대가 죽어도 산다.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { memory: "1Gi" }
