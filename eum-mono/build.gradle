plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'java'
}

group = 'com.pizzastudio.eum'
version = '1.0.0'
sourceCompatibility = '17'
targetCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://maven.egovframe.go.kr/maven/" } // 표준프레임워크 원격 저장소
}

ext {
    set('egovframeBootParentVersion', '5.0.0')
    set('springModulithVersion', '1.4.4')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

dependencies {
    // 표준프레임워크 실행환경
    implementation("org.egovframe.rte:egovframe-rte-fdl-cmmn:${egovframeBootParentVersion}") {
        exclude group: 'org.egovframe.rte', module: 'egovframe-rte-fdl-logging'
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // querydsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'com.mysql:mysql-connector-j:8.4.0'
    runtimeOnly 'com.h2database:h2'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // 모듈 경계 선언(13.3). 어노테이션만 들어 있어 실행에 영향이 없다.
    implementation 'org.springframework.modulith:spring-modulith-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 경계를 빌드가 검증하게 한다(13.3)
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// querydsl 생성 위치
def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
    main.java.srcDirs += [querydslDir]
}

clean {
    delete file(querydslDir)
}

tasks.withType(JavaCompile) {
    options.generatedSourceOutputDirectory = file(querydslDir)
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
}

test {
    // 실패 메시지를 콘솔에도 온전히 찍는다.
    //
    // 기본값에서는 `java.lang.AssertionError` 한 줄만 나오고 어느 클래스가 무엇을 어겼는지는
    // HTML 보고서를 열어야 보인다. **CI 로그만 보는 사람에게는 아무 정보가 없다**(13.3).
    testLogging {
        exceptionFormat = 'full'
        showStackTraces = false
        events 'failed'
    }
    useJUnitPlatform()
}

// 실행 가능한 jar 이름을 고정한다.
// build/libs 에 부트 jar 와 plain jar 가 함께 있어, Dockerfile 에서 *.jar 로 받으면
// 어느 쪽이 들어갈지 순서에 달린다.
bootJar {
    archiveFileName = 'app.jar'
}

