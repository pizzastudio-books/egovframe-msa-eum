# MySQL 로 띄울 때. 운영 전제와 같은 형태다.
#   ./gradlew bootRun --args='--spring.profiles.active=mysql'
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/eum?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:eum_app}
    password: ${MYSQL_PASSWORD:eum_app}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      # 스키마는 한 번만 만든다. 이미 있으면 CREATE TABLE IF NOT EXISTS 가 넘어간다.
      mode: always

  h2:
    console:
      enabled: false

# 타 기관 데이터베이스도 같은 인스턴스의 다른 데이터베이스로 띄운다.
# 실제 사업에서는 기관마다 다른 서버다.
eum:
  legacy:
    # 타 기관 테이블은 상대가 만든다. 이음은 조회만 한다.
    init: false
    bizinfo:
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/bizinfo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    taxinfo:
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/taxinfo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:eum_app}
    password: ${MYSQL_PASSWORD:eum_app}
