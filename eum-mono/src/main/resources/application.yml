spring:
  application:
    name: eum

  datasource:
    # 운영 전제는 기관 MySQL. 실습은 H2 를 MySQL 모드로 띄운다.
    # 5장에서 이 인메모리 DB 가 왜 문제가 되는지 다룬다.
    url: jdbc:h2:mem:eum;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
      hibernate.format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# 토큰
token:
  secret: eum_local_token_secret
  expiration-millis: 3600000

# 야간 배치
eum:
  batch:
    payment:
      cron: "0 0 2 * * *"
      limit: 500

management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.pizzastudio.eum: debug
