# 컴포즈에서 인그레스가 하는 일을 대신하는 앞단.
#
# 클러스터에서는 인그레스가 /api 를 앱으로, 나머지를 화면으로 보낸다(9.2·16.1).
# 컴포즈에는 인그레스가 없으므로 그 갈래를 여기에 적는다. 화면 컨테이너는 어느 쪽에서든
# 정적 파일만 내보내면 된다 — 같은 이미지가 두 곳에서 그대로 돈다.
#
# 갈래를 화면 컨테이너 안에 넣지 않는 이유가 이것이다. 넣으면 컴포즈용 이미지와
# 클러스터용 이미지가 갈라지고, 둘이 어긋나는 순간 "내 노트북에서는 됐는데" 가 된다.

server {
    listen 8080;
    server_name _;

    # 도커 안쪽 DNS. 이것이 있어야 nginx 가 뜰 때가 아니라 요청할 때 이름을 찾는다.
    # 없으면 앱 컨테이너가 아직 안 떴을 때 앞단이 통째로 죽는다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend "http://eum:8080";
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location / {
        set $frontend "http://web:8080";
        proxy_pass $frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
