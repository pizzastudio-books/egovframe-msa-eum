# 화면을 내보내는 설정.
#
# 8080 으로 듣는다. 80 은 특권 포트라 root 로 띄워야 하는데, 클러스터에서는 컨테이너를
# root 로 돌리지 않는다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 화면 안에서 주소를 바꾸는 구조다. /applications/3 을 새로고침하면 서버에는 그런
    # 파일이 없다. 없으면 index.html 을 돌려주어 화면이 스스로 경로를 읽게 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 를 여기서 넘기지 않는다.
    #
    # 넘기려면 upstream 이름을 적어야 하는데, nginx 는 뜰 때 그 이름을 찾는다. 이름이
    # 없으면 설정 오류로 죽는다. 실제로 겪었다 — 화면 파드가 CrashLoopBackOff 였고
    # 원인은 화면과 상관없는 뒤쪽 서비스 이름이었다.
    #
    # 애초에 /api 는 여기로 오지 않는다. 인그레스가 앞에서 갈라 게이트웨이로 보낸다(16.1).
    # 화면 컨테이너는 정적 파일만 내보낸다.

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
