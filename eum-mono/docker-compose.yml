# 이음을 컨테이너로 띄운다 (6.5).
#
#   docker compose up -d mysql       # DB 만 먼저
#   ./gradlew bootJar                # jar 를 만들고
#   docker compose up -d --build     # 앱·화면·앞단까지
#
# 다 뜨면 http://localhost:8080 이다. 화면과 API 가 같은 주소로 나온다.
# 8080 이 이미 쓰이고 있으면 EUM_PORT 로 바꾼다. kind 클러스터가 켜져 있으면 겹친다.
#
# 도커 데스크톱이 없어도 된다. Docker Engine 이나 Podman 이면 그대로 돈다.

services:
  mysql:
    image: mysql:8.0
    container_name: eum-mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "13306:3306"
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
      - eum-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  eum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eum-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: eum_app
      MYSQL_PASSWORD: eum_app
      TZ: Asia/Seoul
    expose:
      - "8080"

  # 화면. 빌드한 정적 파일을 nginx 한 장에 담았다.
  # 이 책에서 화면 개발은 다루지 않는다(6.5).
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eum-web
    expose:
      - "8080"

  # 클러스터의 인그레스가 하는 일을 여기서 대신한다.
  # /api 는 앱으로, 나머지는 화면으로 보낸다.
  edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: eum-edge
    depends_on:
      - eum
      - web
    volumes:
      - ./docker/edge.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # kind 클러스터도 8080 을 쓴다(local/kind-cluster.yaml). 둘을 같이 띄우려면
      #   EUM_PORT=8090 docker compose up -d
      - "${EUM_PORT:-8080}:8080"

volumes:
  eum-mysql-data:
